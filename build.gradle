buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'scala'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

scala {
    version = "2.13.10"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    embedded
    compileClasspath.extendsFrom embedded
    runtimeClasspath.extendsFrom embedded
    implementation.extendsFrom embedded
}

repositories {
    mavenCentral()
    maven {
        name "MightyPirates"
        url "https://maven.cil.li/"
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven {
        name "SquidDev" /* CC: Tweaked */
        url "https://squiddev.cc/maven/"
    }
    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://modmaven.dev"
        content {
            includeGroup "mezz.jei"
            includeGroup 'appeng'
        }
    }
    maven {
        url "https://chickenbones.net/maven/"
        content {
            includeGroup "codechicken"
            includeGroup "mrtjp"
        }
    }
    maven {
        url "https://modmaven.dev/"
        content {
            includeGroup "appeng"
            includeGroup "mekanism"
        }
    }
    maven {
        url "https://proxy-maven.covers1624.net/"
        content {
            includeModule "net.minecraftforge", "Scorge"
        }
    }
    maven {
        name = "kotori316"
        url = uri("https://maven.kotori316.com")
        content {
            includeModule("com.kotori316", "ScalableCatsForce".toLowerCase())
            includeModule("org.typelevel", "cats-core_3")
            includeModule("org.typelevel", "cats-kernel_3")
            includeModule("org.typelevel", "cats-free_3")
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly "org.scala-lang:scala-library:2.13.10"
    compileOnly "org.typelevel:cats-core_3:2.9.2-kotori"
    runtimeOnly(group: "com.kotori316", name: "scalablecatsforce", version: "2.13.10-build-12", classifier: "with-library") {
        transitive(false)
    }

    implementation "com.typesafe:config:1.2.1"
    embedded "com.typesafe:config:1.2.1"
    embedded ":OC-LuaJ-20220907.1"
    embedded ":OC-JNLua-20230530.0"
    embedded ":OC-JNLua-Natives-20220928.1"

    def jeiSlug = "jei-${minecraft_version}"

    compileOnly "curse.maven:tis-3d-238603:${tis3d_version}"
    compileOnly "curse.maven:jade-324717:${jade_version}"
    compileOnly "org.squiddev:cc-tweaked-${minecraft_version}:${cct_version}"

    runtimeOnly "maven.modrinth:modernfix:${modernfix_version}"
    
    // CoFH Core & Thermal
    implementation "curse.maven:cofh-core-69162:4801048"
    implementation fg.deobf("curse.maven:thermal-foundation-222880:4788649")

    compileOnly("appeng:appliedenergistics2:${ae2_version}:api") { transitive = false }
    compileOnly("mekanism:Mekanism:${mekanism_version}:api") { transitive = false }
    compileOnly("codechicken:CBMultipart:${cbmultipart_version}:universal") {
        exclude module: jeiSlug
        exclude module: "CodeChickenLib"
    }
    compileOnly "codechicken:ChickenASM:${casm_version}"
    runtimeOnly "mezz.jei:${jeiSlug}-forge:${jei_version}"
    compileOnly "mezz.jei:${jeiSlug}-forge-api:${jei_version}"
    compileOnly "codechicken:CodeChickenLib:${ccl_version}:universal"
    compileOnly "codechicken:EnderStorage:${enderstorage_version}:universal"
    compileOnly("mrtjp:ProjectRed:${projred_version}:core") {
        exclude module: "CodeChickenLib"
        exclude module: jeiSlug
        exclude module: "CBMultipart"
    }

    testImplementation "org.scala-lang:scala-library:2.13.10"
    testImplementation "junit:junit:4.13.2"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    from({
        configurations.embedded.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude 'META-INF', 'META-INF/**'
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.forkOptions.memoryMaximumSize = '2g'
    scalaCompileOptions.forkOptions.jvmArgs = ['-Xss4m']
}